name: CI/CD visaconsultancy-api-server

on:
  push:
    branches: ['production']

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout code
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------
      # 3. Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # 4. Login to GHCR
      # -----------------------------
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # -----------------------------
      # 5. Build & Push Docker image
      # -----------------------------
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/visaconsultancyapiserver:prod
            ghcr.io/${{ github.repository }}/visaconsultancyapiserver:latest
            ghcr.io/${{ github.repository }}/visaconsultancyapiserver:${{ github.sha }}

      # -----------------------------
      # 6. Deploy to VPS
      # -----------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/backend/visaconsultancyapiserver

            echo "⬇️ Pulling latest images..."
            docker compose pull

            echo "🚀 Restarting containers..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning unused images..."
            docker image prune -f

            echo "✅ Deployment complete!"
