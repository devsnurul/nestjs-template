services:
  redis:
    image: redis:7-alpine

    command: redis-server --appendonly yes --loglevel warning

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: admin
      REDIS_DB: ${REDIS_DB:-0}

    volumes:
      - redis_data:/data

    networks:
      - backend

    expose:
      - '6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  backend:
    external: true
