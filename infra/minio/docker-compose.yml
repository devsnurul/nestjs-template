services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    command: server /data --console-address ":9001"

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: strongpassword

    volumes:
      - minio_data:/data

    networks:
      - backend
      - proxy

    expose:
      - '9000'
      - '9001'

volumes:
  minio_data:

networks:
  backend:
    external: true
  proxy:
    external: true
